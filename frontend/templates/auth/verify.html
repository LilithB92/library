{% extends "base.html" %}

{% block title %}Подтверждение email — Библиотека{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-body text-center py-5">
                <i class="bi bi-envelope-check text-success" style="font-size: 4rem;"></i>
                <h3 class="mt-3">Email подтвержден!</h3>
                <p class="text-muted">Теперь вы можете войти в аккаунт.</p>
                <a href="{% url 'frontend:login' %}" class="btn btn-accent">
                    <i class="bi bi-box-arrow-in-right"></i> Войти
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
