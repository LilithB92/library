{% extends "base.html" %}

{% block title %}Удалить автора — Библиотека{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'frontend:author_list' %}">Авторы</a></li>
        <li class="breadcrumb-item"><a href="{% url 'frontend:author_detail' pk=object.pk %}">{{ object.full_name }}</a></li>
        <li class="breadcrumb-item active">Удаление</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-body text-center py-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                <h4 class="mt-3">Удалить автора?</h4>
                <p class="text-muted mb-3">
                    «<strong>{{ object.full_name }}</strong>» будет удалён безвозвратно.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Да, удалить
                        </button>
                        <a href="{% url 'frontend:author_detail' pk=object.pk %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
